
<h1>Assessment Management</h1>

<h2>Assessment List</h2>

<a href="{% url 'assessment_create' %}">
    Add New Assessment
</a>

<br><br>

<table style="border: 1px solid black; border-collapse: collapse;">
    <thead>
        <tr>
            <th style="border: 1px solid black; padding: 8px;">
                Course
            </th>

            <th style="border: 1px solid black; padding: 8px;">
                Assessment Name
            </th>

            <th style="border: 1px solid black; padding: 8px;">
                Weight (%)
            </th>

            <th style="border: 1px solid black; padding: 8px;">
                Actions
            </th>
        </tr>
    </thead>

    <tbody>
        {% for assessment in assessments %}
        <tr>
            <td style="border: 1px solid black; padding: 8px;">
                {{ assessment.course.course_code }}
            </td>

            <td style="border: 1px solid black; padding: 8px;">
                {{ assessment.name }}
            </td>

            <td style="border: 1px solid black; padding: 8px;">
                {{ assessment.weight }}%
            </td>

            <td style="border: 1px solid black; padding: 8px;">
                <a href="{% url 'assessment_edit' assessment.pk %}">
                    Edit
                </a>

                |

                <a href="{% url 'assessment_delete' assessment.pk %}">
                    Delete
                </a>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="4" style="border: 1px solid black; padding: 8px;">
                No assessments found.
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<br>

<a href="{% url 'student_list' %}">
    Go to Students
</a>

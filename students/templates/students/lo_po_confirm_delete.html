cat > students/templates/students/lo_po_confirm_delete.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete LO-PO Mapping</title>
</head>
<body>
    <h1>Delete LO-PO Mapping</h1>

    <p>Are you sure you want to delete this mapping?</p>

    <p>
        {{ mapping.learning_outcome }} →
        {{ mapping.program_outcome }}
        (Weight: {{ mapping.weight }})
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'lo_po_list' %}">Cancel</a>
</body>
</html>
EOF

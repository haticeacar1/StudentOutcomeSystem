
<h1>Delete Grade</h1>

<p>
    Are you sure you want to delete this grade?
</p>

<p>
    Student: {{ grade.enrollment.student.first_name }}
    {{ grade.enrollment.student.last_name }}
</p>

<p>
    Course: {{ grade.enrollment.course.course_code }}
</p>

<p>
    Assessment: {{ grade.assessment.name }}
</p>

<p>
    Score: {{ grade.score }}
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'grade_list' %}">
    Cancel
</a>

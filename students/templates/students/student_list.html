
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>
</head>
<body>

    <h1>Student Management</h1>

    <h2>Student List</h2>

    <a href="{% url 'student_create' %}">
        Add New Student
    </a>

    <br><br>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Student Number</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.student_number }}</td>
                <td>{{ student.first_name }}</td>
                <td>{{ student.last_name }}</td>
                <td>{{ student.email }}</td>

                <td>
                    <a href="{% url 'student_edit' student.pk %}">
                        Edit
                    </a>

                    |

                    <a href="{% url 'student_delete' student.pk %}">
                        Delete
                    </a>
                </td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="5">
                    No students found.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>

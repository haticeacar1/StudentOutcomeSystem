
<h1>Enrollment Management</h1>

<a href="{% url 'enrollment_create' %}">Add New Enrollment</a>

<br><br>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>Student</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for enrollment in enrollments %}
        <tr>
            <td>
                {{ enrollment.student.first_name }}
                {{ enrollment.student.last_name }}
            </td>
            <td>{{ enrollment.course.course_code }}</td>
            <td>
                <a href="{% url 'enrollment_edit' enrollment.pk %}">Edit</a>
                |
                <a href="{% url 'enrollment_delete' enrollment.pk %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No enrollments found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<br>
<a href="{% url 'grade_list' %}">Go to Grades</a>

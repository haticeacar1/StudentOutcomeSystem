
<h1>Program Outcome Management</h1>

<h2>Program Outcome List</h2>

<a href="{% url 'program_outcome_create' %}">
    Add New Program Outcome
</a>

<br><br>

<table style="border: 1px solid black; border-collapse: collapse;">
    <thead>
        <tr>
            <th style="border: 1px solid black; padding: 8px;">
                PO Code
            </th>

            <th style="border: 1px solid black; padding: 8px;">
                Description
            </th>

            <th style="border: 1px solid black; padding: 8px;">
                Actions
            </th>
        </tr>
    </thead>

    <tbody>
        {% for outcome in outcomes %}
        <tr>
            <td style="border: 1px solid black; padding: 8px;">
                {{ outcome.code }}
            </td>

            <td style="border: 1px solid black; padding: 8px;">
                {{ outcome.description }}
            </td>

            <td style="border: 1px solid black; padding: 8px;">

                <a href="{% url 'program_outcome_edit' outcome.pk %}">
                    Edit
                </a>

                |

                <a href="{% url 'program_outcome_delete' outcome.pk %}">
                    Delete
                </a>

            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="3" style="border: 1px solid black; padding: 8px;">
                No program outcomes found.
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<br>

<a href="{% url 'student_list' %}">
    Go to Students
</a>

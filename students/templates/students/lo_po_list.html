
<h1>Learning Outcome - Program Outcome Mapping</h1>

<a href="{% url 'lo_po_create' %}">Add New Mapping</a>

<br><br>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>Learning Outcome</th>
            <th>Program Outcome</th>
            <th>Weight</th>
        </tr>
    </thead>

    <tbody>
        {% for mapping in mappings %}
        <tr>
            <td>{{ mapping.learning_outcome }}</td>
            <td>{{ mapping.program_outcome }}</td>
            <td>{{ mapping.weight }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No mappings found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<br>
<a href="{% url 'dashboard' %}">Back to Dashboard</a>
